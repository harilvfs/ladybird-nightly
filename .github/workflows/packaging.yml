name: Nightly Linux Packages

run-name: Nightly Linux Packages from ${{ inputs.ref || 'master' }}

# build ubuntu, fedora and flatpak packages from upstream setup; maintain arch and opensuse packaging here
# every distro builds on its own: the release publishes whatever passed, and its description lists only that

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ladybird branch, tag or full commit hash to build'
        required: true
        default: 'master'
        type: string

permissions:
  contents: write

jobs:
  Source:
    name: Source
    runs-on: ubuntu-latest

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      date: ${{ steps.info.outputs.date }}
      short_sha: ${{ steps.info.outputs.short_sha }}
      sha: ${{ steps.info.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ inputs.ref || 'master' }}

      - name: Get commit info
        id: info
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          name="ladybird"
          git archive --prefix= --add-virtual-file="${name}/REVISION:$(git rev-parse HEAD)" --prefix="${name}/" \
            --output="${name}-source.tar" HEAD
          xz -9 -T0 "${name}-source.tar"

      - name: Upload
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: '*-source.tar.xz'
          archive: false
          if-no-files-found: error

  Build:
    name: ${{ matrix.system }}, x86_64
    needs: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    container:
      image: ${{ matrix.image }}
      options: --ulimit core=1

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: 'Ubuntu 26.04'
            slug: 'ubuntu-26.04'
            image: 'docker.io/library/ubuntu:26.04'
            packages: 'DEB'

          - system: 'Fedora 44'
            slug: 'fedora-44'
            image: 'docker.io/library/fedora:44'
            packages: 'RPM'

    steps:
      - name: Download the source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.Source.outputs.artifact-id }}

      - name: Install xz to unpack the source
        if: ${{ startsWith(matrix.system, 'Ubuntu') }}
        run: |
          apt-get update -o APT::Update::Error-Mode=any
          apt-get install -y --no-install-recommends xz-utils

      - name: Unpack the source
        run: |
          tar -xf ./*-source.tar.xz --strip-components=1
          rm ./*-source.tar.xz

      - name: Install the build dependencies
        run: ./Meta/Docker/ci/install-build-dependencies.sh

      # upstream's build action is referenced directly from the upstream repository: a local
      # ./.github/actions path inside it is now resolved against this repository, which has no such action
      - name: Build
        uses: LadybirdBrowser/ladybird/.github/actions/build@master
        with:
          os: 'Linux'
          arch: 'x86_64'
          toolchain: 'Clang'
          build_preset: 'Distribution'
          use_caches: false

      - name: Package for ${{ matrix.system }}
        working-directory: ${{ github.workspace }}/Build
        run: |
          cpack -G "${{ matrix.packages }}" -B packages \
            -D CPACK_COMPONENTS_ALL="ladybird_Runtime;ladybird_SystemIntegration;ladybird_SystemSymbols"

      - name: Collect the runtime package
        working-directory: ${{ github.workspace }}/Build/packages
        shell: bash
        env:
          DATE: ${{ needs.Source.outputs.date }}
          SHORT_SHA: ${{ needs.Source.outputs.short_sha }}
          SLUG: ${{ matrix.slug }}
          PACKAGE_TYPE: ${{ matrix.packages }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Packages produced:"
          ls -lh

          files=()
          if [[ "$PACKAGE_TYPE" == "DEB" ]]; then
            EXT="deb"
            files=(ladybird_*.deb)
          else
            EXT="rpm"
            for f in ladybird-*.rpm; do
              if [[ "$f" != ladybird-debuginfo-* ]]; then
                files+=("$f")
              fi
            done
          fi

          if [[ ${#files[@]} -ne 1 ]]; then
            echo "error: expected exactly one runtime package, found ${#files[@]}" >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp "${files[0]}" "${GITHUB_WORKSPACE}/out/ladybird-nightly-${SLUG}-x86_64-${DATE}-${SHORT_SHA}.${EXT}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

  BuildArch:
    name: Arch Linux, x86_64
    needs: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    container:
      image: docker.io/library/archlinux:latest
      options: --ulimit core=1

    steps:
      - name: Download the source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.Source.outputs.artifact-id }}

      - name: Unpack the source
        run: |
          tar -xf ./*-source.tar.xz --strip-components=1
          rm ./*-source.tar.xz

      # upstream's dependency script only knows Ubuntu and Fedora for now, so this list is
      # those two lists mapped to Arch package names
      - name: Install the build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            autoconf autoconf-archive automake base-devel clang cmake compiler-rt curl \
            ffmpeg file git glslang libdrm libglvnd libpulse libtool lld llvm mesa nasm \
            ncurses ninja patchelf perl pkgconf python qt6-base qt6-positioning qt6-tools \
            qt6-wayland rustup tar ttf-liberation unzip wayland xcb-util-wm xz zip

      # same toolchain pinning as upstream's script, using Arch's rustup
      - name: Install Rust
        run: |
          set -euo pipefail
          export RUSTUP_HOME=/opt/rustup
          export CARGO_HOME=/opt/cargo
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          components="$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')"
          rustup toolchain install "$channel" --profile minimal --component "$components"
          rustup default "$channel"
          echo "RUSTUP_HOME=${RUSTUP_HOME}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME}" >> "$GITHUB_ENV"

      # the build generates the WebAssembly spec tests, which needs wasm-tools
      - name: Install wasm-tools
        run: |
          set -euo pipefail
          dockerfile=Meta/Docker/ci/Dockerfile
          version="$(sed -n 's/^ARG WASM_TOOLS_VERSION=//p' "$dockerfile")"
          sha256="$(sed -n 's/^ARG WASM_TOOLS_SHA256_X86_64=//p' "$dockerfile")"
          name="wasm-tools-${version}-x86_64-linux"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/${name}.tar.gz"
          echo "${sha256}  /tmp/wasm-tools.tar.gz" | sha256sum --check --quiet
          tar -xzf /tmp/wasm-tools.tar.gz -C /usr/local/bin --strip-components=1 "${name}/wasm-tools"
          wasm-tools --version

      - name: Build
        uses: LadybirdBrowser/ladybird/.github/actions/build@master
        with:
          os: 'Linux'
          arch: 'x86_64'
          toolchain: 'Clang'
          build_preset: 'Distribution'
          use_caches: false

      - name: Build the Arch package
        env:
          DATE: ${{ needs.Source.outputs.date }}
          SHORT_SHA: ${{ needs.Source.outputs.short_sha }}
        run: |
          set -euo pipefail

          # install runtime in /opt and desktop files in /usr
          STAGE="${GITHUB_WORKSPACE}/pkgroot"
          rm -rf "$STAGE"
          DESTDIR="$STAGE" cmake --install Build --strip --prefix /opt/ladybird --component ladybird_Runtime
          DESTDIR="$STAGE" cmake --install Build --strip --prefix /usr --component ladybird_SystemIntegration

          # upstream renamed the browser binary from Ladybird to ladybird; accept either
          BROWSER_BINARY=""
          for candidate in ladybird Ladybird; do
            if [[ -x "$STAGE/opt/ladybird/bin/$candidate" ]]; then
              BROWSER_BINARY="$candidate"
              break
            fi
          done

          if [[ -z "$BROWSER_BINARY" ]]; then
            echo "error: no browser binary found in opt/ladybird/bin, install layout:" >&2
            find "$STAGE" -maxdepth 3 | sort >&2
            exit 1
          fi
          echo "Browser binary: ${BROWSER_BINARY}"

          # keep bundled libs private
          PRIVATE_LIB="$STAGE/opt/ladybird/lib/ladybird-nightly"
          mkdir -p "$PRIVATE_LIB"
          if [[ -d "$STAGE/opt/ladybird/lib" ]]; then
            while IFS= read -r -d '' library; do
              mv -- "$library" "$PRIVATE_LIB/"
            done < <(find "$STAGE/opt/ladybird/lib" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -print0)
          fi

          # set rpaths for bundled libs
          while IFS= read -r -d '' elf; do
            if file -b "$elf" | grep -q '^ELF '; then
              case "$elf" in
                "$PRIVATE_LIB"/*)
                  patchelf --add-rpath '$ORIGIN' "$elf"
                  ;;
                *)
                  patchelf --add-rpath '$ORIGIN/../lib/ladybird-nightly' "$elf"
                  ;;
              esac
            fi
          done < <(find "$STAGE/opt/ladybird/bin" "$STAGE/opt/ladybird/libexec" "$PRIVATE_LIB" -type f -print0)

          # the system integration component may already install a ladybird command; point it at /opt
          if [[ -e "$STAGE/usr/bin/ladybird" || -L "$STAGE/usr/bin/ladybird" ]]; then
            echo "Existing usr/bin/ladybird:"
            ls -l "$STAGE/usr/bin/ladybird"
          fi
          mkdir -p "$STAGE/usr/bin"
          ln -sfn "/opt/ladybird/bin/${BROWSER_BINARY}" "$STAGE/usr/bin/ladybird"

          # show how the desktop entry launches the browser, to check it still resolves
          grep -rh '^Exec=' "$STAGE/usr/share/applications" 2>/dev/null || true

          # runtime dependencies: the system libraries the installed binaries link against,
          # mapped to the pacman packages that own them
          DEPENDS=$(
            for f in "$STAGE"/opt/ladybird/bin/* "$STAGE"/opt/ladybird/libexec/*; do
              if [[ -f "$f" && -x "$f" ]]; then
                ldd "$f" 2>/dev/null || true
              fi
            done \
              | awk '/=> \/(usr\/)?lib/ {print $3}' \
              | sort -u \
              | xargs -r pacman -Qqo 2>/dev/null \
              | sort -u \
              | tr '\n' ' ' || true
          )
          echo "Runtime dependencies: ${DEPENDS}"

          # makepkg refuses to run as root, so build the package as a normal user
          useradd -m builder
          PKGDIR=/home/builder/pkg
          mkdir -p "$PKGDIR" /tmp/pkgout
          {
            echo "pkgname=ladybird-nightly"
            echo "pkgver=${DATE}.${SHORT_SHA}"
            echo "pkgrel=1"
            echo "pkgdesc='Unofficial nightly build of the Ladybird browser'"
            echo "arch=('x86_64')"
            echo "url='https://ladybird.org'"
            echo "license=('BSD-2-Clause')"
            echo "depends=(${DEPENDS})"
            echo "provides=('ladybird')"
            echo "conflicts=('ladybird' 'ladybird-git')"
            echo "options=('!strip' '!debug' '!lto' '!emptydirs')"
            echo 'package() {'
            echo '  cp -a "$STAGE/." "$pkgdir/"'
            echo '}'
          } > "$PKGDIR/PKGBUILD"
          chown -R builder "$PKGDIR" /tmp/pkgout

          su builder -c "cd ${PKGDIR} && STAGE=${STAGE} PKGDEST=/tmp/pkgout makepkg --nodeps --nocheck --noconfirm"

          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp /tmp/pkgout/*.pkg.tar.zst "${GITHUB_WORKSPACE}/out/ladybird-nightly-arch-x86_64-${DATE}-${SHORT_SHA}.pkg.tar.zst"
          ls -lh "${GITHUB_WORKSPACE}/out"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-arch
          path: out/*
          if-no-files-found: error

  BuildOpenSUSE:
    name: openSUSE Tumbleweed, x86_64
    needs: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    # absolute path, so the shell is found even if a step ever changes PATH
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}

    container:
      image: registry.opensuse.org/opensuse/toolbox:latest
      options: --ulimit core=1
      # the toolbox image has no PATH, so GITHUB_PATH would replace it with just the new dirs
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      # opensuse deps; upstream's script only handles ubuntu and fedora
      # extra x11/wayland/vulkan headers are needed by vcpkg's angle
      - name: Install the build dependencies
        run: |
          set -euo pipefail
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            autoconf autoconf-archive automake ca-certificates-mozilla ccache clang22 cmake \
            curl diffutils file findutils gcc16 gcc16-c++ git glslang-devel gzip libdrm-devel \
            liberation-fonts libglvnd-devel libpulse-devel libtool lld22 make nasm \
            ncurses-devel ninja patch patchelf perl pkgconf-pkg-config python3 qt6-base-devel \
            qt6-positioning-devel qt6-tools-devel qt6-wayland-devel rpm-build sed tar unzip \
            which xcb-util-wm-devel xz zip \
            Mesa-libEGL-devel Mesa-libGL-devel libX11-devel libxcb-devel libxkbcommon-devel \
            libxkbcommon-x11-devel vulkan-devel wayland-devel zlib-devel

      # upstream ci pins llvm 22; tumbleweed ships it as clang22/lld22
      # link the unversioned names the build action and linker look for
      - name: Use Clang 22
        run: |
          set -euo pipefail
          for tool in clang clang++ ld.lld; do
            ln --symbolic --force "/usr/bin/${tool}-22" "/usr/bin/${tool}"
          done
          clang --version
          clang++ --version
          ld.lld --version

      - name: Download the source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.Source.outputs.artifact-id }}

      - name: Unpack the source
        run: |
          tar -xf ./*-source.tar.xz --strip-components=1
          rm ./*-source.tar.xz

      # rustup pin from upstream's dependency script
      - name: Install Rust
        run: |
          set -euo pipefail
          dockerfile=Meta/Docker/ci/Dockerfile
          rustup_version="$(sed -n 's/^ARG RUSTUP_VERSION=//p' "$dockerfile")"
          rustup_sha256="$(sed -n 's/^ARG RUSTUP_INIT_SHA256_X86_64=//p' "$dockerfile")"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${rustup_version}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${rustup_sha256}  /tmp/rustup-init" | sha256sum --check --quiet
          chmod +x /tmp/rustup-init

          export RUSTUP_HOME=/opt/rustup
          export CARGO_HOME=/opt/cargo
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          components="$(sed -n 's/^components = \[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ')"
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain "$channel" \
            --component "$components"
          echo "RUSTUP_HOME=${RUSTUP_HOME}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME}" >> "$GITHUB_ENV"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"

      # wasm-tools is needed to generate the wasm spec tests
      - name: Install wasm-tools
        run: |
          set -euo pipefail
          dockerfile=Meta/Docker/ci/Dockerfile
          version="$(sed -n 's/^ARG WASM_TOOLS_VERSION=//p' "$dockerfile")"
          sha256="$(sed -n 's/^ARG WASM_TOOLS_SHA256_X86_64=//p' "$dockerfile")"
          name="wasm-tools-${version}-x86_64-linux"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${version}/${name}.tar.gz"
          echo "${sha256}  /tmp/wasm-tools.tar.gz" | sha256sum --check --quiet
          tar -xzf /tmp/wasm-tools.tar.gz -C /usr/local/bin --strip-components=1 "${name}/wasm-tools"
          wasm-tools --version

      - name: Build
        uses: LadybirdBrowser/ladybird/.github/actions/build@master
        with:
          os: 'Linux'
          arch: 'x86_64'
          toolchain: 'Clang'
          build_preset: 'Distribution'
          use_caches: false

      # the rpm's symlink and exec lines bypass /usr/bin/ladybird
      # swap them for a launcher that passes the opensuse ca bundle
      - name: Add the openSUSE launcher wrapper
        run: |
          set -euo pipefail
          cat > Meta/CMake/opensuse_launcher.cmake <<'EOF'
          set(browser_root "${CPACK_TEMPORARY_DIRECTORY}/Browser")
          set(launcher "${browser_root}/usr/bin/ladybird")

          # the launcher is a symlink to an absolute /opt path that does not exist in the staging tree,
          # so EXISTS is false for it; check for the link itself as well
          if (NOT EXISTS "${launcher}" AND NOT IS_SYMLINK "${launcher}")
            return()
          endif()

          file(REMOVE "${launcher}")
          file(WRITE "${launcher}" [=[#!/bin/sh
          binary=""
          for candidate in /opt/ladybird/bin/ladybird /opt/ladybird/bin/Ladybird; do
              if [ -x "$candidate" ]; then
                  binary="$candidate"
                  break
              fi
          done

          if [ -z "$binary" ]; then
              echo "ladybird: browser binary not found" >&2
              exit 1
          fi

          bundle=""
          for candidate in /var/lib/ca-certificates/ca-bundle.pem /etc/ssl/ca-bundle.pem; do
              if [ -r "$candidate" ]; then
                  bundle="$candidate"
                  break
              fi
          done

          if [ -n "$bundle" ]; then
              exec "$binary" --certificate "$bundle" "$@"
          fi
          exec "$binary" "$@"
          ]=])
          file(CHMOD "${launcher}" PERMISSIONS
              OWNER_READ OWNER_WRITE OWNER_EXECUTE
              GROUP_READ GROUP_EXECUTE
              WORLD_READ WORLD_EXECUTE)

          foreach(relative IN ITEMS
              "usr/share/applications/org.ladybird.Ladybird.desktop"
              "usr/share/dbus-1/services/org.ladybird.Ladybird.service")
            set(path "${browser_root}/${relative}")
            if (EXISTS "${path}")
              file(READ "${path}" contents)
              string(REPLACE "/opt/ladybird/bin/Ladybird" "/usr/bin/ladybird" contents "${contents}")
              string(REPLACE "/opt/ladybird/bin/ladybird" "/usr/bin/ladybird" contents "${contents}")
              file(WRITE "${path}" "${contents}")
            endif()
          endforeach()
          EOF

          cat >> Meta/CMake/cpack_project_config.cmake <<'EOF'
          if (CPACK_GENERATOR STREQUAL "RPM")
            list(APPEND CPACK_PRE_BUILD_SCRIPTS "${CMAKE_CURRENT_LIST_DIR}/opensuse_launcher.cmake")
          endif()
          EOF

      - name: Package for openSUSE
        working-directory: ${{ github.workspace }}/Build
        env:
          DATE: ${{ needs.Source.outputs.date }}
          SHORT_SHA: ${{ needs.Source.outputs.short_sha }}
        run: |
          set -euo pipefail
          # override upstream's fedora-only font and codec requirements
          # dated version so zypper treats each nightly as an upgrade
          cpack -G RPM -B packages \
            -D CPACK_COMPONENTS_ALL="ladybird_Runtime;ladybird_SystemIntegration;ladybird_SystemSymbols" \
            -D CPACK_PACKAGE_VERSION="${DATE}.${SHORT_SHA}" \
            -D CPACK_RPM_BROWSER_PACKAGE_REQUIRES="liberation-fonts, ca-certificates" \
            -D CPACK_RPM_BROWSER_PACKAGE_RECOMMENDS="libavcodec"

      - name: Collect the runtime package
        working-directory: ${{ github.workspace }}/Build/packages
        env:
          DATE: ${{ needs.Source.outputs.date }}
          SHORT_SHA: ${{ needs.Source.outputs.short_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "Packages produced:"
          ls -lh

          files=()
          for f in ladybird-*.rpm; do
            if [[ "$f" != ladybird-debuginfo-* ]]; then
              files+=("$f")
            fi
          done

          if [[ ${#files[@]} -ne 1 ]]; then
            echo "error: expected exactly one runtime package, found ${#files[@]}" >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp "${files[0]}" "${GITHUB_WORKSPACE}/out/ladybird-nightly-opensuse-tumbleweed-x86_64-${DATE}-${SHORT_SHA}.rpm"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-opensuse
          path: out/*
          if-no-files-found: error

  BuildFlatpak:
    name: Flatpak, x86_64
    needs: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    # same image and options as upstream's release workflow
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    env:
      BUNDLE: ladybird-nightly-flatpak-x86_64-${{ needs.Source.outputs.date }}-${{ needs.Source.outputs.short_sha }}.flatpak

    steps:
      - name: Download the source
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.Source.outputs.artifact-id }}

      - name: Unpack the source
        run: |
          tar -xf ./*-source.tar.xz --strip-components=1
          rm ./*-source.tar.xz

      # upstream's workaround: the image bakes the SDK into a read-only layer, and an SDK update from
      # Flathub then fails with EXDEV. copying the installation into the writable layer first avoids it
      - name: Make the baked-in Flatpak installation writable
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak

      # patch the manifest: force the baseline CPU target, and create /app/bin before gn copies into it
      - name: Patch the flatpak manifest
        run: |
          python3 - <<'SCRIPT'
          import json

          path = "Meta/CMake/flatpak/org.ladybird.Ladybird.json"
          with open(path) as file:
              manifest = json.load(file)

          ladybird = next(module for module in manifest["modules"] if module["name"] == "Ladybird")
          ladybird["config-opts"].append("-DLADYBIRD_BASELINE_CPU_TARGET=ON")

          # upstream's gn-whole-enchilada.sh runs `cp out/gn "$FLATPAK_DEST"/bin/` without
          # creating the directory first, which fails with "Not a directory" when /app/bin is missing
          gn = next((module for module in manifest["modules"] if module["name"] == "gn"), None)
          if gn is not None:
              commands = gn.setdefault("build-commands", [])
              mkdir = 'mkdir -p "$FLATPAK_DEST/bin"'
              if mkdir not in commands:
                  commands.insert(0, mkdir)

          with open(path, "w") as file:
              json.dump(manifest, file, indent=4)
          SCRIPT

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: Meta/CMake/flatpak/org.ladybird.Ladybird.json
          arch: x86_64
          cache: false
          upload-artifact: false

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: pkg-flatpak
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

      # a build that produces a bundle is not the same as a bundle that installs;
      # install it and start a shell inside the sandbox to catch a broken bundle early.
      # the artifact is uploaded first, so a failed smoke test still leaves the bundle to inspect;
      # the release job only publishes it when this whole job passed
      - name: Smoke test the bundle
        run: |
          set -euo pipefail

          ls -lh "$BUNDLE"

          # read the command from the manifest instead of assuming the binary name
          app_command="$(python3 -c 'import json; print(json.load(open("Meta/CMake/flatpak/org.ladybird.Ladybird.json"))["command"])')"
          if [[ -z "$app_command" ]]; then
            echo "error: the flatpak manifest does not set a command" >&2
            exit 1
          fi
          echo "App command: ${app_command}"

          flatpak install --system --noninteractive -y "$BUNDLE"
          flatpak info org.ladybird.Ladybird
          flatpak run --command=sh org.ladybird.Ladybird -c "test -x '/app/bin/${app_command}'"

  Release:
    name: Publish to GitHub Release
    needs: [Source, Build, BuildArch, BuildOpenSUSE, BuildFlatpak]
    # runs even when some builds failed, so one broken distro never blocks the others
    if: ${{ !cancelled() && needs.Source.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true

      # the flatpak job uploads its bundle before the smoke test, so only keep it if the job passed
      - name: Drop the Flatpak bundle if its job did not pass
        if: ${{ needs.BuildFlatpak.result != 'success' }}
        run: rm -f out/*.flatpak

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.Source.outputs.date }}
          SHORT_SHA: ${{ needs.Source.outputs.short_sha }}
          SHA: ${{ needs.Source.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(out/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "error: no packages were built, nothing to publish" >&2
            exit 1
          fi

          # also publish an undated copy of every package so the download link never changes
          for f in "${files[@]}"; do
            undated="${f/-${DATE}-${SHORT_SHA}/}"
            if [[ "$undated" != "$f" ]]; then
              cp "$f" "$undated"
            fi
          done
          files=(out/*)

          TAG="packages-${DATE}-${SHORT_SHA}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Uploading to existing release: $TAG"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Linux packages ${DATE} (${SHORT_SHA})" \
              --notes "Publishing the packages for this build." \
              "${files[@]}"
          fi

          # write the description from what the release really contains, so it only lists
          # packages that exist (and says which ones are missing)
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          has_ubuntu=0
          has_fedora=0
          has_opensuse=0
          has_arch=0
          has_flatpak=0
          grep -q '^ladybird-nightly-ubuntu-26.04-x86_64-.*\.deb$' <<< "$assets" && has_ubuntu=1
          grep -q '^ladybird-nightly-fedora-44-x86_64-.*\.rpm$' <<< "$assets" && has_fedora=1
          grep -q '^ladybird-nightly-opensuse-tumbleweed-x86_64-.*\.rpm$' <<< "$assets" && has_opensuse=1
          grep -q '^ladybird-nightly-arch-x86_64-.*\.pkg\.tar\.zst$' <<< "$assets" && has_arch=1
          grep -q '^ladybird-nightly-flatpak-x86_64-.*\.flatpak$' <<< "$assets" && has_flatpak=1

          missing=()
          [[ "$has_ubuntu" -eq 1 ]] || missing+=("Ubuntu 26.04")
          [[ "$has_fedora" -eq 1 ]] || missing+=("Fedora 44")
          [[ "$has_opensuse" -eq 1 ]] || missing+=("openSUSE Tumbleweed")
          [[ "$has_arch" -eq 1 ]] || missing+=("Arch Linux")
          [[ "$has_flatpak" -eq 1 ]] || missing+=("Flatpak")

          {
            echo "**Ladybird nightly Linux packages**"
            echo ""
            echo "- Upstream commit: [${SHORT_SHA}](https://github.com/LadybirdBrowser/ladybird/commit/${SHA})"
            echo "- Built: ${DATE}"
            echo "- Platform: Linux x86_64"
            echo ""
            echo "**Easiest way to install (picks the right package for your distro):**"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash"
            echo '```'
            echo ""
            echo "**Or install by hand:**"
            echo ""
            if [[ "$has_ubuntu" -eq 1 ]]; then
              echo "Ubuntu 26.04:"
              echo '```bash'
              echo "sudo apt install ./ladybird-nightly-ubuntu-26.04-x86_64-*.deb"
              echo '```'
              echo ""
            fi
            if [[ "$has_fedora" -eq 1 ]]; then
              echo "Fedora 44:"
              echo '```bash'
              echo "sudo dnf install ./ladybird-nightly-fedora-44-x86_64-*.rpm"
              echo '```'
              echo ""
            fi
            if [[ "$has_opensuse" -eq 1 ]]; then
              echo "openSUSE Tumbleweed:"
              echo '```bash'
              echo "sudo zypper install --allow-unsigned-rpm ./ladybird-nightly-opensuse-tumbleweed-x86_64-*.rpm"
              echo '```'
              echo ""
            fi
            if [[ "$has_arch" -eq 1 ]]; then
              echo "Arch Linux (update your system first with pacman -Syu):"
              echo '```bash'
              echo "sudo pacman -U ./ladybird-nightly-arch-x86_64-*.pkg.tar.zst"
              echo '```'
              echo "The Arch package installs the runtime under /opt/ladybird and provides the ladybird terminal command."
              echo ""
            fi
            if [[ "$has_flatpak" -eq 1 ]]; then
              echo "Any other distro (Flatpak, needs the Flathub remote for the KDE runtime):"
              echo '```bash'
              echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash -s -- --flatpak"
              echo '```'
              echo ""
              echo "Or install the downloaded bundle by hand:"
              echo '```bash'
              echo "flatpak install --user ./ladybird-nightly-flatpak-x86_64-*.flatpak"
              echo "flatpak run org.ladybird.Ladybird"
              echo '```'
              echo ""
            fi
            if [[ ${#missing[@]} -gt 0 ]]; then
              printf -v missing_list '%s, ' "${missing[@]}"
              echo "> The build failed for: ${missing_list%, }. I will check it soon, try the other packages for now."
              echo ""
            fi
            echo "**Package not working?** If a distro package fails to install or run, use the Flatpak build instead. If the Flatpak also fails, [report the issue](https://github.com/${GITHUB_REPOSITORY}/issues) with your distro, version, and error."
            echo ""
            echo "> Unofficial Ladybird nightly. Some sites may not work, crashes are possible, and security is not guaranteed. Use at your own risk."
          } > /tmp/release-notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
